# This is a basic workflow to help you get started with Actions

name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
    branches: ["test", "dev", "main"]
  pull_request:
    branches: ["test", "dev", "main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Testing
        run: npm test

      - name: Build application
        run: npm run build

      - name: Test the build
        run: |
          npm run dev &
          sleep 10
          curl --retry 3 --retry-delay 5 -f http://localhost:5173
          kill %1

      - name: Build
        run: npm run build

  # Semgrep Security Scanning Job
  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: semgrep --config=p/security-audit --config=p/react --config=p/owasp-top-ten --config=p/javascript --json --output=semgrep.json .
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30

  # Retire.js SCA Scan
  retirejs-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Retire.js SCA
        run: |
          npx retire --path . --outputformat json --outputpath retirejs-report.json || true
        continue-on-error: true

      - name: Upload Retire.js Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirejs-report
          path: retirejs-report.json
          retention-days: 30
