# This is a basic workflow to help you get started with Actions

name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
    branches: ["test", "dev", "main"]
  pull_request:
    branches: ["test", "dev", "main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Testing
        run: npm test

      - name: Build application
        run: npm run build

      - name: Test the build
        run: |
          npm run dev &
          sleep 10
          curl --retry 3 --retry-delay 5 -f http://localhost:5173
          kill %1

      - name: Build
        run: npm run build

  # OWASP ZAP DAST Scan Job
  zap-dast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start the application for DAST
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "Application is ready for ZAP scan"
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:5173 > /dev/null

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.4.0
        with:
          target: "http://127.0.0.1:5173"
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
          if-no-files-found: ignore
          retention-days: 30

  # Semgrep Security Scanning Job
  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: semgrep --config=p/security-audit --config=p/react --config=p/owasp-top-ten --config=p/javascript --json --output=semgrep.json .
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30

  # GitLeaks Secret Scanning Job
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run GitLeaks Scan
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config-path .gitleaks.toml --report-format json --report-path gitleaks.json || true
          else
            gitleaks detect --source . --report-format json --report-path gitleaks.json || true
          fi
        continue-on-error: true

      - name: Upload GitLeaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 30

  # Retire.js SCA Scan
  retirejs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Retire.js SCA
        run: |
          npx retire --path . --outputformat json --outputpath retire.json || true
        continue-on-error: true

      - name: Upload Retire.js Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirejs-report
          path: retire.json
          retention-days: 30

  # Upload scan reports to DefectDojo
  upload-reports:
    runs-on: ubuntu-latest
    needs: [zap-dast-scan, semgrep-scan, gitleaks-scan, retirejs-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Download ZAP artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zap-report
          path: .

      - name: Download Semgrep artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: .

      - name: Download GitLeaks artifact
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .

      - name: Download Retire.js artifact
        uses: actions/download-artifact@v4
        with:
          name: retirejs-report
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload dependencies
        run: pip install requests

      - name: Upload scan reports
        env:
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DEFECTDOJO_IMPORT_URL: ${{ secrets.DEFECTDOJO_IMPORT_URL }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          python upload_reports.py gitleaks.json
          python upload_reports.py semgrep.json
          python upload_reports.py retire.json
          python upload_reports.py report_json.json
